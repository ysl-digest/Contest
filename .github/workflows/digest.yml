name: weekly-digest

# classify(전체 수집·IT/Non-IT 분류) → it(IT 발행) → non-it(Non-IT 발행)을 순서대로 실행한다.
# 트랙마다 최대 50건을 VLM으로 추출하므로 job을 나눠 각자 timeout을 갖게 하고,
# 상태 파일은 artifact로 다음 job에 넘긴다 (dry-run에서도 분류 결과를 이어받기 위해).
on:
  schedule:
    - cron: "47 23 * * 0" # 월요일 08:47 KST (UTC 일요일 23:47, 정각 회피)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Issue 생성·상태 커밋 없이 결과만 로그로 출력"
        type: boolean
        default: true
      max_items:
        description: "트랙별 VLM 처리 상한 (비우면 기본값 50)"
        type: string
        default: ""

# Issue는 별도 저장소(vars.ISSUE_REPO, vars.NON_IT_ISSUE_REPO)에 ISSUE_TOKEN으로 발행하므로 이 저장소에는 상태 커밋 권한만 필요
permissions:
  contents: write

concurrency:
  group: weekly-digest
  cancel-in-progress: false

env:
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  ISSUE_TOKEN: ${{ secrets.ISSUE_TOKEN }}
  ISSUE_REPO: ${{ vars.ISSUE_REPO }}
  NON_IT_ISSUE_REPO: ${{ vars.NON_IT_ISSUE_REPO }}
  VLM_MODEL: ${{ vars.VLM_MODEL }}
  VLM_FALLBACK_MODEL: ${{ vars.VLM_FALLBACK_MODEL }}
  CLASSIFIER_MODEL: ${{ vars.CLASSIFIER_MODEL }}
  CLASSIFIER_FALLBACK_MODEL: ${{ vars.CLASSIFIER_FALLBACK_MODEL }}
  CLASSIFY_LOW: ${{ vars.CLASSIFY_LOW }}
  CLASSIFY_HIGH: ${{ vars.CLASSIFY_HIGH }}
  MAX_ITEMS: ${{ inputs.max_items }}

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Classify
        run: python -m contest_digest classify
      - uses: actions/upload-artifact@v4
        with:
          name: state-classify
          path: data/state.json
      - name: Commit state
        if: env.DRY_RUN != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(state): classify $(TZ=Asia/Seoul date +%F)"
          git push

  publish-it:
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }} # 앞 job이 커밋한 최신 상태
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Load state from previous job
        uses: actions/download-artifact@v5
        with:
          name: state-classify
          path: data
      - name: Run
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python -m contest_digest run --track it --no-classify --dry-run | tee "$GITHUB_STEP_SUMMARY"
          else
            python -m contest_digest run --track it --no-classify
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: state-it
          path: data/state.json
      - name: Commit state
        if: env.DRY_RUN != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(state): it $(TZ=Asia/Seoul date +%F)"
          git push

  publish-non-it:
    needs: [classify, publish-it]
    # IT 발행이 실패해도 Non-IT는 진행한다. 이때는 IT job이 남긴 artifact가 없으므로 분류 결과를 쓴다
    if: ${{ !cancelled() && needs.classify.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }} # 앞 job이 커밋한 최신 상태
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Load state from previous job
        uses: actions/download-artifact@v5
        with:
          name: ${{ needs.publish-it.result == 'success' && 'state-it' || 'state-classify' }}
          path: data
      - name: Run
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python -m contest_digest run --track non-it --no-classify --dry-run | tee "$GITHUB_STEP_SUMMARY"
          else
            python -m contest_digest run --track non-it --no-classify
          fi
      - name: Commit state
        if: env.DRY_RUN != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(state): non-it $(TZ=Asia/Seoul date +%F)"
          git push
